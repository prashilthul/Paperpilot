
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: paperpilot
      POSTGRES_PASSWORD: paperpilot
      POSTGRES_DB: paperpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paper-pilot-net

  backend:
    build: ./backend
    command: sh -c "PYTHONPATH=. uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://paperpilot:paperpilot@postgres:5432/paperpilot
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - paper-pilot-net

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - paper-pilot-net

volumes:
  pgdata:

networks:
  paper-pilot-net:
    driver: bridge
